
services:
  - type: web
    name: raganork-md
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SESSION
        sync: false
      - key: HANDLERS
        value: ".,"
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
